pvc:
  enabled: true
  accessMode: ReadWriteOnce
  storageClassName: ebs-sc
  storage: 1Gi
  pvName: mysql-pv
  mountPath: /var/lib/mysql

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi